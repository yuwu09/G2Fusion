#### general settings
name: DiT_test
model: DiT
distortion: mixed
gpu_ids: [0]
sampling_steps: 20

#### datasets
datasets:
  test:
    name: test
    mode: XYZ
    dataroot_X: PATH_TO_PRIVATE_DATA/datasets/test/X
    dataroot_Y: PATH_TO_PRIVATE_DATA/datasets/test/Y
    dataroot_Z: PATH_TO_PRIVATE_DATA/datasets/test/Z
    X_size: 256
    Y_size: 256
    Z_size: 256
    n_workers: 4
    batch_size: 1
    color: RGB

#### network structures
network_AE:
  which_model: AutoEncoder
  setting:
    in_ch: 3
    out_ch: 3
    ch: 8
    ch_mult: [4, 8, 8, 16]
    embed_dim: 8

network_Match:
  which_model_Match: DenseMatcher
  setting:
    in_channels: 3
    unshare_depth: 4
    matcher_depth: 4

network_dino:
  which_model_dino: DINOv3
  setting:
    model_dir: PATH_TO_DINOV3_MODEL

# DiT_B_2 parameters
network_Fusion:
  which_model: DiT
  setting: 
    input_size: 32
    patch_size: 2
    in_channels: 8
    hidden_size: 1024
    depth: 24
    num_heads: 16
    mlp_ratio: 4.0
    learn_sigma: true

#### path
path:
  pretrain_model_AE: PATH_TO_CHECKPOINT/PLACEHOLDER_AE_WEIGHT.pth
  pretrain_model_Fusion: PATH_TO_CHECKPOINT/PLACEHOLDER_FUSION_WEIGHT.pth
  pretrain_model_Dino: PATH_TO_CHECKPOINT/PLACEHOLDER_DINO_WEIGHT.pth
  pretrain_model_Matcher: PATH_TO_CHECKPOINT/PLACEHOLDER_MATCHER_WEIGHT.pth
  # pretrain_model_Fusion_EMA: PATH_TO_CHECKPOINT/PLACEHOLDER_FUSION_EMA_WEIGHT.pth
  strict_load: true
  resume_state:

#### logger
logger:
  print_freq: 1
