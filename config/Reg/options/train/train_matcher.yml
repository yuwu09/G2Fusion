#### general settings
name: Matcher
use_tb_logger: true
model: Matcher
distortion: Composite
gpu_ids: [0, 1]

#### datasets
datasets:
  train:
    name: Train_Dataset
    mode: XYflow
    dataroot_X: PATH_TO_PRIVATE_DATA/datasets/train/X
    dataroot_Y: PATH_TO_PRIVATE_DATA/datasets/train/Y
    use_shuffle: true
    n_workers: 8 # per GPU
    batch_size: 16
    X_size: 384
    Y_size: 384
    use_flip: true
    use_rot: true
    use_swap: true
    color: RGB
  val:
    name: Val_Dataset
    mode: XYflow
    dataroot_X_warp: PATH_TO_PRIVATE_DATA/datasets/test/X_warp
    dataroot_X: PATH_TO_PRIVATE_DATA/datasets/test/X
    dataroot_Y: PATH_TO_PRIVATE_DATA/datasets/test/Y
    color: RGB

#### network structures
network_Match:
  which_model_Match: DenseMatcher
  setting:
    in_channels: 3
    unshare_depth: 4
    matcher_depth: 4

network_dino:
  which_model_dino: DINOv3
  setting:
    model_dir: PATH_TO_DINOV3_MODEL

#### path
path:
  pretrain_model_Dino: PATH_TO_CHECKPOINT/PLACEHOLDER_DINO_WEIGHT.pth
  pretrain_model_Matcher: null
  strict_load: true
  resume_state: null

#### training settings: learning rate scheme, loss
train:
  optimizer: Adam # Adam, AdamW, Lion
  lr_AE: !!float 5e-5
  lr_scheme: TrueCosineAnnealingLR
  beta1: 0.9
  beta2: 0.999
  niter: 100000
  warmup_iter: -1 # no warm up
  lr_steps: [40000, 80000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  # criterion
  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0
  val_freq: !!float 1000

#### logger
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 1000
